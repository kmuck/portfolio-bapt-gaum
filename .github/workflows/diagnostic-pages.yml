name: Diagnostic Pages
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/diagnostic-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  deployments: read
  actions: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Relance de la publication
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          echo '=== branch policies'; gh api repos/$R/environments/github-pages/deployment-branch-policies || true
          MAIN=$(gh api repos/$R/commits/main --jq .sha); echo "main=$MAIN"
          echo '=== request build'; gh api -X POST repos/$R/pages/builds || true
          for i in $(seq 1 40); do
            sleep 10
            s=$(gh api repos/$R/pages/builds/latest --jq '.status+" "+.commit+" "+(.error.message // "")' || true)
            echo "$i $s"
            case "$s" in "built $MAIN"*|"errored $MAIN"*) break;; esac
          done
          echo '=== runs'; gh api "repos/$R/actions/runs?per_page=3" --jq '.workflow_runs[]|[.id,.name,.head_sha[0:7],.status,.conclusion]|@tsv' || true
          echo '=== pages'; gh api repos/$R/pages || true
      - name: Site en ligne
        run: |
          sleep 30
          for u in https://kmuck.github.io/portfolio-bapt-gaum/ https://kmuck.github.io/portfolio-bapt-gaum/assets/css/style.css; do
            echo "=== $u"; curl -sSI "$u" | head -3 || true
          done
          echo '=== body'; curl -sSL https://kmuck.github.io/portfolio-bapt-gaum/ | grep -o '<title>[^<]*</title>' | head -3 || true
          curl -sSL https://kmuck.github.io/portfolio-bapt-gaum/assets/css/style.css | grep -m3 -o 'background[^;]*' || true
