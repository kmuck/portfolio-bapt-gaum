name: Import depuis Wix

# Lancement manuel uniquement (onglet Actions), tant que le site Wix existe encore.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-wix
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/import_wix.py
      - name: Commit du contenu importé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A import assets/img/wix
          git diff --cached --quiet || git commit -m "Import du contenu Wix"
          git push
