name: Import depuis Wix

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/import_wix.py
      - .github/workflows/import-wix.yml

permissions:
  contents: write

concurrency:
  group: import-wix
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/import_wix.py
      - name: Commit du contenu importé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add import assets/img/wix
          git diff --cached --quiet || git commit -m "Import du contenu Wix"
          git push
