name: Captures du site Wix

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - scripts/capture_wix.js
      - .github/workflows/capture-wix.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/capture_wix.js
      - name: Commit des captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add import/captures
          git diff --cached --quiet || git commit -m "Captures du site Wix"
          git push
